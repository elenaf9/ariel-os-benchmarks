modules:
  - name: benchmark-default
    selects:
      - executor-thread
      - sw/threading
      - sw/benchmark
      - ?release
      - opt_speed
  - name: patch
    help: patch used repo revision
    env: 
      global:
        UPSTREAM_REPO: https://github.com/ariel-os/ariel-os
        CARGO_ARGS:
          - --config 'patch."${UPSTREAM_REPO}".ariel-os.git="${FORKED_REPO}"'
          - --config 'patch."${UPSTREAM_REPO}".ariel-os.rev="${DEP_REV}"'
          - --config 'patch."${UPSTREAM_REPO}".ariel-os-boards.git="${FORKED_REPO}"'
          - --config 'patch."${UPSTREAM_REPO}".ariel-os-boards.rev="${DEP_REV}"'

  - name: ariel-reallocation
    selects:
      - patch
      - benchmark-default
    provides_unique:
      - rev
    env:
      global:
        FORKED_REPO: https://github.com/elenaf9/RIOT-rs
        DEP_REV: 29f21cba6fb574a17d48514ee1448fe365ce1bb5
        FEATURES:
          - reallocation

  - name: ariel
    selects:
      - benchmark-default
    provides_unique:
      - rev
    
  - name: dual-core
    conflicts:
      - single-core
    env:
      global:
        FEATURES:
          - dual-core
          - bench-multicore/multicore
          - ariel-os/multi-core

  - name: affinity
    conflicts:
      - main
      - single-core
      - reallocation
    env:
      global:
        FEATURES:
          - affinity
          - ariel-os/core-affinity
  
  - name: t1
    provides_unique:
      - n-threads
    env:
      global:
        FEATURES:
          - t1
  - name: t2
    provides_unique:
      - n-threads
    env:
      global:
        FEATURES:
          - t2
  - name: t3
    provides_unique:
      - n-threads
    env:
      global:
        FEATURES:
          - t3
  - name: t4
    provides_unique:
      - n-threads
    env:
      global:
        FEATURES:
          - t4
subdirs:
  - bench_fib
  - bench_matrix_mult
  - bench_thread_flags
  - bench_thread_flags_preempt
